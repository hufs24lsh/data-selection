[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shallowfrontier"
version = "0.1.0"
description = "Energy-efficient LLM data selection via asymmetric prefix extrapolation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tqdm",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
