name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test tools
        run: python -m pip install -r requirements/requirements_dev.txt

      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 src scripts tests eval/medeval

      - name: Shell syntax
        run: bash -n scripts/run_shallowfrontier.sh

      - name: Unit tests (selection, grouping, noise rule, scoring rules, pools, command line)
        run: python -m pytest -q
