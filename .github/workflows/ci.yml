name: Release integrity

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test tools
        run: python -m pip install -r requirements/dev.txt

      - name: Undefined-name check
        run: ruff check --select F821 scripts tests

      - name: Bash syntax
        run: |
          bash -n scripts/evaluation/eval_k256_official.sh
          bash -n scripts/evaluation/eval_k128_official.sh

      - name: Evaluation wrapper CPU preflight
        run: |
          EVAL_PY=python bash scripts/evaluation/eval_k256_official.sh --preflight-only
          EVAL_PY=python bash scripts/evaluation/eval_k128_official.sh --preflight-only

      - name: CPU semantic and release tests
        run: |
          python -m pytest -q tests --cov=scripts/selection --cov-report=term-missing
