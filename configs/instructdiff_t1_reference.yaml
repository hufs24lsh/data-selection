seed: 42

base_model: models/Qwen2.5-7B
data_path: data/mixed/math10k_med10k_seed42.jsonl
output_dir: outputs/instructdiff_t1_reference

iterations: 3

warmup:
  sample_size: 2000
  limit: 20000
  train:
    model_max_length: 2048
    per_device_train_batch_size: 1
    num_train_epochs: 3
    learning_rate: 0.00002
    global_batch_size: 64

    mode: sft

    bf16: true
    optim: adamw_bnb_8bit
    gradient_checkpointing: true

    lr_scheduler_type: cosine
    warmup_ratio: 0.05
    weight_decay: 0.01
    max_grad_norm: 1.0

score:
  max_samples: 20000

select:
  nll_reject_ratio: 0.1
  select_ratio: 0.1

select_train:
  train:
    model_max_length: 2048
    per_device_train_batch_size: 1
    num_train_epochs: 3
    learning_rate: 0.00002
    global_batch_size: 64

    mode: sft

    bf16: true
    optim: adamw_bnb_8bit
    gradient_checkpointing: true

    lr_scheduler_type: cosine
    warmup_ratio: 0.05
    weight_decay: 0.01
    max_grad_norm: 1.0
